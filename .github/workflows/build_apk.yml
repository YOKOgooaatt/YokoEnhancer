name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java Subsystem
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK Environment
      # This step installs the missing build tools natively on the cloud computer
      uses: android-actions/setup-android@v3

    - name: Compile App via Global System Engine
      run: gradle assembleDebug --no-daemon

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: RealFace-Enhancer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
