name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java Subsystem
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Initialize Direct Workspace Wrapper
      # Dynamically generates a raw, flat layout maps on the cloud server
      run: |
        gradle init --type basic --dsl kotlin --incubating --no-daemon || true

    - name: Compile App via Global System Engine
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: RealFace-Enhancer-APK
        path: "**/build/outputs/apk/debug/*.apk"
