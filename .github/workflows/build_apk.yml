name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java Subsystem
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android Gradle Automation
      uses: subosito/flutter-action@v2
      # This step sets up default Android environment commands easily
      
    - name: Compile App and Build APK
      run: |
        chmod +x gradlew || true
        gradle assembleDebug --no-daemon

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: RealFace-Enhancer-APK
        path: app/build/outputs/apk/debug/app-debug.apk
